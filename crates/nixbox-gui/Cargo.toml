[package]
name = "nixbox-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Desktop GUI for NixBox, with a Nix-backed Cargo launcher"

[features]
default = []
native = [
	"dep:nixbox-core",
	"dep:nixbox-config",
	"dep:nixbox-nix",
	"dep:anyhow",
	"dep:tokio",
	"dep:tracing",
	"dep:tracing-subscriber",
	"dep:gpui-kit",
	"dep:regex",
	"dep:unicode-segmentation",
	"dep:unicode-width",
]

[[bin]]
# Its own name, like `nixbox-cli`, so it can share a profile with `nixbox`.
name = "nixbox-gui"
path = "src/main.rs"

[dependencies]
nixbox-core = { path = "../nixbox-core", version = "0.3.0", optional = true }
nixbox-config = { path = "../nixbox-config", version = "0.3.0", optional = true }
nixbox-nix = { path = "../nixbox-nix", version = "0.3.0", optional = true }
anyhow = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# One facade over gpui, gpui-component, and the Lucide icons, pinned together.
gpui-kit = { version = "0.6.6", optional = true }
# Within-line diff emphasis, adapted from delta, uses the same tokenizer crates.
regex = { version = "1.12", optional = true }
unicode-segmentation = { version = "1.13", optional = true }
unicode-width = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
gpui-kit = { version = "0.6.6", features = ["test-support"] }
nixbox-core = { path = "../nixbox-core", version = "0.3.0", features = ["test-util"] }
