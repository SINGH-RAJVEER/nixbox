[package]
name = "nixbox-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Headless engine behind nixbox: manifest mutation, config wiring, and rebuild dispatch"

[features]
# Exposes `Session::fake_build` so front-end tests can simulate a rebuild.
test-util = []
telemetry-receiver = ["dep:axum", "dep:rusqlite"]

[dependencies]
nixbox-config = { path = "../nixbox-config", version = "=0.4.6-nightly.20261025" }
nixbox-nix = { path = "../nixbox-nix", version = "=0.4.6-nightly.20261025" }
anyhow = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "test-util"] }

[[example]]
name = "telemetry-receiver"
required-features = ["telemetry-receiver"]
