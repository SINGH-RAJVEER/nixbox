[package]
name = "nixbox-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["nixos", "nix", "tui", "package-manager", "home-manager"]
categories.workspace = true
description = "Terminal UI package manager for NixOS and Home Manager"

[[bin]]
# Its own name, like `nixbox-cli`, so it can share a profile with the desktop
# `nixbox` without overwriting it.
name = "nixbox-tui"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
nixbox-nix = { path = "../nixbox-nix", version = "0.4.5" }
nixbox-core = { path = "../nixbox-core", version = "0.4.5" }
nixbox-config = { path = "../nixbox-config", version = "0.4.5" }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tui-input = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }

[dev-dependencies]
nixbox-core = { path = "../nixbox-core", version = "0.4.5", features = ["test-util"] }
