[package]
name = "nixbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description.workspace = true

[[bin]]
name = "nixbox"
path = "src/main.rs"

[features]
default = ["tui"]
# Builds the terminal UI in. Without it `nixbox` is a plain CLI and none of
# ratatui, crossterm, or tui-input is compiled or downloaded.
tui = ["dep:nixbox-tui"]

[dependencies]
nixbox-tui = { path = "../nixbox-tui", version = "0.2.2", optional = true }
nixbox-nix = { path = "../nixbox-nix", version = "0.2.2" }
nixbox-core = { path = "../nixbox-core", version = "0.2.2" }
nixbox-config = { path = "../nixbox-config", version = "0.2.2" }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
directories = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
