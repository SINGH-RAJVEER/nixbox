[package]
name = "nixbox-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line package manager for NixOS and Home Manager, with no user interface"

[[bin]]
# Deliberately not `nixbox`: that name belongs to the desktop `nixbox` crate,
# and two packages installing the same executable would overwrite each other.
name = "nixbox-cli"
path = "src/main.rs"

[dependencies]
# Only the command tree: no front-end is passed to it, so neither ratatui nor
# gpui is ever compiled.
nixbox-cmd = { path = "../nixbox-cmd", version = "0.3.6" }
