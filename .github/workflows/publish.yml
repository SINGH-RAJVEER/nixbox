name: Publish crates

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Select release channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Select version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if test "$RELEASE_BRANCH" = dev; then
            channel=nightly
            # The source date and run number stay fixed across retry attempts.
            date="$(date -u -d "@$(git show -s --format=%ct)" +%Y%m%d)"
            version="$(uv run scripts/version.py --nightly --date "$date" --sequence "$GITHUB_RUN_NUMBER")"
          else
            channel=stable
            version="$(uv run scripts/version.py --stable)"
            # Merging nightly manifests requires an explicit stable promotion.
            git diff --exit-code -- Cargo.toml Cargo.lock 'crates/*/Cargo.toml'
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Test release versioning
        run: uv run --no-project python -m unittest discover -s scripts -p 'test_*.py'
      - name: Apply release version
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/version.py "--$RELEASE_CHANNEL" --version "$RELEASE_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install test tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,jj-cli@0.45.1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --exclude nixbox --all-targets --locked -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --exclude nixbox --locked

      - name: Check both terminal binaries
        run: |
          set -euo pipefail

          cargo build -p nixbox-tui -p nixbox-cli --locked

          test -x target/debug/nixbox-tui
          test -x target/debug/nixbox-cli

          target/debug/nixbox-tui --version
          target/debug/nixbox-cli --version

          help="$(target/debug/nixbox-tui --help)"
          grep -q 'Usage: nixbox-tui' <<<"$help"
          help="$(target/debug/nixbox-cli --help)"
          grep -q 'Usage: nixbox-cli' <<<"$help"

          if target/debug/nixbox-cli >/dev/null 2>bare.log; then
            echo "bare nixbox-cli exited successfully" >&2
            exit 1
          fi
          grep -q 'This is nixbox-cli' bare.log

      - name: Check dependency-free GUI launcher
        run: |
          set -euo pipefail
          cargo build -p nixbox --locked
          fake_dir="$(mktemp -d)"
          trap 'rm "$fake_dir/nix"; rmdir "$fake_dir"' EXIT
          cat > "$fake_dir/nix" <<'SH'
          #!/bin/sh
          printf '<%s>\n' "$@"
          SH
          chmod +x "$fake_dir/nix"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          output="$(PATH="$fake_dir:$PATH" target/debug/nixbox-gui --target nixos)"
          package=nixbox
          if [[ "$version" == *-nightly.* ]]; then package=nixbox-nightly; fi
          expected="$(printf '<run>\n<github:SINGH-RAJVEER/nixbox/v%s#%s>\n<-->\n<--target>\n<nixos>' "$version" "$package")"
          test "$output" = "$expected"

  gui:
    name: Desktop GUI
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Apply release version
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/version.py "--$RELEASE_CHANNEL" --version "$RELEASE_VERSION"

      - name: Install the graphics stack
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Lint and test
        run: |
          cargo clippy -p nixbox --features native --all-targets --locked -- -D warnings
          cargo nextest run -p nixbox --features native --locked

  nix:
    name: Nix build limits
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Apply release version
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/version.py "--$RELEASE_CHANNEL" --version "$RELEASE_VERSION"

      - name: Install Nix
        uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31

      - name: Check package build limits
        run: nix build --no-link --print-build-logs --max-jobs 1 --cores 2 .#checks.x86_64-linux.build-jobs .#checks.x86_64-linux.release-channels

      - name: Check dependency reuse and source filtering
        run: uv run --no-project python scripts/check_nix_cache.py

  nix-packages:
    name: Nix packages (${{ matrix.system }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply release version
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/version.py "--$RELEASE_CHANNEL" --version "$RELEASE_VERSION"
      - name: Install Nix
        uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Use the NixBox binary cache
        uses: cachix/cachix-action@v16
        with:
          name: nixbox
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || env.CACHIX_AUTH_TOKEN == '' }}
      - name: Build packages and run their separate tests
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          NIX_SYSTEM: ${{ matrix.system }}
        shell: bash
        run: |
          set -euo pipefail
          interfaces=(nixbox-tui nixbox-cli)
          if [[ "$NIX_SYSTEM" == *-linux ]]; then interfaces+=(nixbox); fi
          for interface in "${interfaces[@]}"; do
            nix build --accept-flake-config --no-link --print-build-logs \
              ".#packages.$NIX_SYSTEM.$interface-$RELEASE_CHANNEL" \
              ".#checks.$NIX_SYSTEM.$interface-$RELEASE_CHANNEL"
          done
      - name: Explain read-only cache access
        if: github.event_name == 'push' && env.CACHIX_AUTH_TOKEN == ''
        run: echo 'Set the CACHIX_AUTH_TOKEN repository secret to enable binary cache uploads.'

  publish:
    name: Publish workspace crates
    needs: [prepare, test, gui, nix, nix-packages]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Apply release version
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/version.py "--$RELEASE_CHANNEL" --version "$RELEASE_VERSION"

      - name: Install the graphics stack
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace
        run: cargo check --workspace --locked

      - name: Tag matching flake release
        id: release_ref
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="v${version}"
          if test "$RELEASE_CHANNEL" = nightly; then
            # Commit before both initial publication and retries so Cargo
            # always publishes from a clean tree.
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add Cargo.toml Cargo.lock 'crates/*/Cargo.toml'
            git commit -m "chore: nightly $version"
          fi
          if remote_commit="$(git ls-remote --exit-code --tags origin "refs/tags/${tag}" | cut -f1)"; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            if test "$RELEASE_CHANNEL" = nightly; then
              test "$(git rev-parse "$tag^")" = "$GITHUB_SHA"
              git diff --exit-code "$tag" HEAD
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            elif test "$remote_commit" = "$GITHUB_SHA"; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            else
              echo "${tag} already points to a previous release; skipping publish"
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            fi
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish crates
        if: steps.release_ref.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
 
          crates=(nixbox-config nixbox-nix nixbox-core nixbox-cmd nixbox-tui nixbox-cli nixbox)

          for crate in "${crates[@]}"; do
            echo "::group::Publishing ${crate} ${version}"

            if cargo publish -p "$crate" --locked 2>&1 | tee publish.log; then
              echo "::endgroup::"
              continue
            fi

            if grep -qiE 'already (exists|uploaded)|crate version .* is already' publish.log; then
              echo "${crate} ${version} is already on crates.io; skipping"
              echo "::endgroup::"
              continue
            fi

            echo "::endgroup::"
            echo "Publishing ${crate} ${version} failed" >&2
            exit 1
          done
