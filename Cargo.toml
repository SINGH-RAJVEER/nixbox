[workspace]
resolver = "2"
members = [
    "crates/nixbox",
    "crates/nixbox-cli",
    "crates/nixbox-cmd",
    "crates/nixbox-tui",
    "crates/nixbox-core",
    "crates/nixbox-nix",
    "crates/nixbox-config",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
authors = ["Rajveer Singh"]
license = "Apache-2.0"
repository = "https://github.com/SINGH-RAJVEER/nixbox"
homepage = "https://github.com/SINGH-RAJVEER/nixbox"
readme = "README.md"
keywords = ["nixos", "nix", "tui", "package-manager", "home-manager"]
categories = ["command-line-utilities"]
description = "TUI package manager for NixOS that wires selections into your flake + home-manager config"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-input = "0.10"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
directories = "5.0"
futures = "0.3"
libc = "0.2"
